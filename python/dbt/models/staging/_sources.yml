version: 2

sources:
  - name: raw
    description: >-
      Raw upstream proposal data. In dev this is materialised into the
      DuckDB warehouse by tests/harness setup; in sandbox it is the
      Snowflake landing zone populated by upstream extractors.
    tables:
      - name: proposals
        description: Raw proposal rows; one per submission.
        columns:
          - name: holder_kind
            data_type: VARCHAR
            description: ADR 006 §1 holder discriminator; "individual" or "entity".
          - name: holder_name
            data_type: VARCHAR
            description: Policy holder's name (PII for individual holders; ADR 006 §1 over-protection caveat).
          - name: premium
            data_type: DOUBLE
            description: Proposed premium amount.
          - name: zip_code
            data_type: VARCHAR
            description: 5-digit ZIP code.
          - name: age
            data_type: INTEGER
            description: Holder age in years.
          - name: schema_version
            data_type: INTEGER
            description: ADR 008 schema version. Defaults to 1.
          - name: schema_effective_date
            data_type: DATE
            description: Date on which this row's schema version became effective.
          - name: erased
            data_type: BOOLEAN
            description: ADR 007 tombstone marker; rows where erased=true are filtered out of consumer-facing views.
