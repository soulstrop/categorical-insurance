# Tool pins for the Python production system. mise loads these when
# the cwd is under python/.

[tools]
python = "3.13"
uv     = "latest"
node  = "lts"
npm = "latest"

[env]
# Pin the venv location so uv and mise agree.
UV_PROJECT_ENVIRONMENT = ".venv"

[tasks.build]
description = "uv sync the python project (resolves from uv.lock)"
run = "uv sync --frozen"

[tasks.test]
description = "pytest the python project"
run = "uv run pytest"

[tasks.lint]
description = "ruff + mypy --strict on the python project"
run = """
uv run ruff check .
uv run ruff format --check .
uv run mypy --strict src/catins
"""

[tasks.fmt]
description = "Format the python project with ruff (in place)"
run = """
uv run ruff format .
uv run ruff check --fix .
"""

[tasks.setup]
description = "One-time: install pre-commit's git hook"
run = "uv run pre-commit install"

[tasks."pre-commit:run"]
description = "Run all pre-commit hooks against all files"
run = "uv run pre-commit run --all-files --config ../.pre-commit-config.yaml"

[tasks."dbt:build"]
description = "Build the dbt project against local DuckDB (dev profile)"
run = "uv run dbt build --project-dir dbt --profiles-dir dbt"

[tasks."dbt:debug"]
description = "Validate the dbt connection (dev profile, DuckDB)"
run = "uv run dbt debug --project-dir dbt --profiles-dir dbt"

[tasks."dbt:check-drift"]
description = "Fail if dbt _sources.yml drifts from CanonicalProposal"
run = "uv run python -m catins.dbt"

[tasks."schema:compat-check"]
description = "Fail if catins.models drifts from schema_baseline.json without `# evolution: breaking` annotation"
run = "uv run python -m catins.schema_evolution.compat"

[tasks."schema:write-baseline"]
description = "Regenerate schema_baseline.json from the current catins.models state (commit it after a breaking change)"
run = "uv run python -m catins.schema_evolution.compat --write"

[tasks."dagster:validate"]
description = "Validate the Dagster Definitions object (catches asset-graph misconfiguration in <1s)"
run = "uv run dagster definitions validate -m catins.orchestration.definitions"

[tasks."dagster:dev"]
description = "Run dagster dev against the catins Definitions (interactive UI)"
run = "uv run dagster dev -m catins.orchestration.definitions"
