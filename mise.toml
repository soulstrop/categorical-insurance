# Root mise configuration: tool versions and task graph for the
# categorical-insurance monorepo.
#
experimental_monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = [
  "python",
  "haskell",
]

# Per-language refinements live in haskell/mise.toml and (after
# step 3 of the migration in docs/PHASES.md) python/mise.toml.
# mise merges these hierarchically as you cd around the tree.

# -----------------------------------------------------------------
# Documentation tasks
# -----------------------------------------------------------------

[tasks."docs:math"]
description = "Build docs/math.tex to math.pdf via latexmk"
dir = "docs"
run = "latexmk -pdf math.tex"

[tasks."docs:math:clean"]
description = "Clean LaTeX build artefacts in docs/"
dir = "docs"
run = "latexmk -C"

[plugins]
tinytex = "https://github.com/mise-plugins/mise-tinytex.git"

[tools]
tinytex = "latest"
perl = "5.38" # needed  for tinytex

act = "latest"
qdns = "latest"
