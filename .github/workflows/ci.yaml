name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Python Job
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
        env:
          # REQUIRED for experimental monorepo features
          MISE_EXPERIMENTAL: 1
      - name: Lint and Test Python
        run: |
          mise run //python:lint
          mise run //python:dbt:check-drift
          mise run //python:dagster:validate
          mise run //python:test

  # Haskell Job
  haskell-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
        env:
          MISE_EXPERIMENTAL: 1
      - name: Verify Haskell Sketch
        run: mise run //haskell:test

  # Documentation Job
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
        env:
          MISE_EXPERIMENTAL: 1
      - name: Install LaTeX packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-extra \
            texlive-science \
            texlive-pictures \
            texlive-fonts-recommended
      - name: Download IEEE journal template
        run: |
          curl -L -o /tmp/ieee-template.zip \
            "https://template-selector.ieee.org/api/ieee-template-selector/template/239/download"
          unzip -o /tmp/ieee-template.zip -d docs/
      - name: Download tikz-cd from CTAN
        run: |
          curl -L -o /tmp/tikz-cd.zip \
            "https://mirrors.ctan.org/graphics/pgf/contrib/tikz-cd.zip"
          unzip -o /tmp/tikz-cd.zip -d /tmp/tikz-cd-pkg
          STY_FILE=$(find /tmp/tikz-cd-pkg -name "tikz-cd.sty" | head -1)
          [ -n "$STY_FILE" ] || { echo "tikz-cd.sty not found in archive"; exit 1; }
          cp "$STY_FILE" docs/
      - name: Build Math Docs
        run: mise run docs:math
