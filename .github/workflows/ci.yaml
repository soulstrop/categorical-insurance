name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Python Job
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
        env:
          # REQUIRED for experimental monorepo features
          MISE_EXPERIMENTAL: 1
      - name: Lint and Test Python
        run: |
          mise run //python:lint
          mise run //python:test

  # Haskell Job
  haskell-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
        env:
          MISE_EXPERIMENTAL: 1
      - name: Verify Haskell Sketch
        run: mise run //haskell:test

  # Documentation Job
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
        env:
          MISE_EXPERIMENTAL: 1
      - name: Build Math Docs
        run: mise run docs:math
