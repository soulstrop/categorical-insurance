name: python

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - "mise.toml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - "mise.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src/catins
      - run: uv run pytest
